name: EAS Update (Mobile Auto-Deploy)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish EAS Update to Expo Cloud
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🚀 Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: 📦 Install Root & Workspace Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build Shared Package
        run: npm --prefix packages/shared run build

      - name: ⚙️ Inject EAS Project ID for CI Update
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            appJson.expo.extra = appJson.expo.extra || {};
            appJson.expo.extra.eas = { projectId: "891b84e5-c90a-448d-be5a-6e87d7784d50" };
            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2));
          '
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "${{ github.event.head_commit.message }}" || true

      - name: 📱 Publish EAS Update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          OUT=$(eas update --auto --non-interactive 2>&1) || {
            echo "$OUT"
            echo "::error::$(echo "$OUT" | tail -n 15 | tr '\n' ' ')"
            exit 1
          }
          echo "$OUT"
